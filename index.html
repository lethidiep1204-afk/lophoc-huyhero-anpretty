<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LophocHuyhero-Anpretty</title>
<meta name="description" content="Sổ tay tự học THCS lớp 6–9: Khoa học tự nhiên, Toán, Tiếng Anh. Học bài ngắn, luyện tập từ cơ bản đến nâng cao, sửa lỗi có gợi ý.">
<meta name="theme-color" content="#1f5fd6">
<meta property="og:title" content="LophocHuyhero-Anpretty">
<meta property="og:description" content="Sổ tay tự học THCS: học, luyện tập và sửa lỗi.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/*
VOICE: sổ tay khám phá — thân thiện với lớp 6, đủ chững chạc cho lớp 9; câu chữ ngắn, động viên.
IDEA: một cuốn sổ tay giấy ô li, mỗi môn là một "tab" màu dán mép sổ.
PICTURE: trang sổ có gáy lò xo với hình vẽ tay của ba môn (nguyên tử – lá, trục số, bong bóng hội thoại).
COLOUR and TYPE: nền trắng ngà, chữ xanh đậm, nút xanh dương; KHTN xanh lá, Toán tím, Anh cam san hô; Be Vietnam Pro.
LAYOUT: danh mục bên trái, bài ở giữa, gia sư bên phải (máy tính); điện thoại xếp dọc, nút "Chọn bài".
*/
:root{color-scheme:light dark;
--bg:light-dark(#fbf7ee,#10172a);--paper:light-dark(#fffdf8,#161f36);--ink:light-dark(#13294b,#e6ecf8);--muted:light-dark(#52617e,#a8b4cc);
--line:light-dark(#e6ddc9,#2a3554);--grid:light-dark(rgba(31,95,214,.07),rgba(140,170,255,.06));
--blue:light-dark(#1f5fd6,#7aa3ff);--on-blue:light-dark(#fff,#0d1530);--blue-soft:light-dark(#e7eefc,#1c2a4d);
--khtn:light-dark(#21804b,#62d394);--khtn-soft:light-dark(#e2f3e8,#15301f);
--toan:light-dark(#6a3dc2,#b99cff);--toan-soft:light-dark(#eee7fb,#271c44);
--anh:light-dark(#cf5032,#ff9c82);--anh-soft:light-dark(#fde9e2,#3a1f19);
--ok:light-dark(#1b7a44,#6bdc9b);--ok-soft:light-dark(#e3f5ea,#14301f);
--bad:light-dark(#b3261e,#ff8a80);--bad-soft:light-dark(#fdecea,#3b1717);
--warn:light-dark(#8a5200,#ffc062);--warn-soft:light-dark(#fff3d6,#3a2a0c);
--r:14px;--sh:0 1px 0 var(--line),0 8px 22px light-dark(rgba(19,41,75,.07),rgba(0,0,0,.35));
--m:var(--blue);--ms:var(--blue-soft)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
a{color:var(--blue)}
h1,h2,h3{line-height:1.15;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(22px,2.6vw,28px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:.4em 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.m-khtn{--m:var(--khtn);--ms:var(--khtn-soft)}.m-toan{--m:var(--toan);--ms:var(--toan-soft)}.m-anh{--m:var(--anh);--ms:var(--anh-soft)}
/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(4vw,14px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:17px;margin-right:auto}
.logo svg{flex:none}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.nav a[aria-current=page]{background:var(--blue-soft);color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,40px) max(4vw,14px)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.soft{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--ms);color:var(--m);white-space:nowrap}
.badge.wait{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(18px,4vw,48px);align-items:center}
.hero .art{aspect-ratio:5/4;width:100%}
.hero .art svg{width:100%;height:100%}
.lead{font-size:18px;color:var(--muted);max-width:56ch}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 6px;max-width:520px}
.grade{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.grade small{font-size:12px;font-weight:600;color:var(--muted)}
.grade[aria-pressed=true]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.grade[aria-pressed=true] small{color:inherit;opacity:.85}
.resume{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-top:16px;border-left:6px solid var(--m)}
.resume .t{flex:1}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0 18px}
.subj{position:relative;text-align:left;padding:18px 18px 16px;border-radius:20px;border:2px solid transparent;background:var(--ms);color:var(--ink);display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;min-height:120px}
.subj[aria-pressed=true]{border-color:var(--m);box-shadow:0 0 0 4px color-mix(in srgb,var(--m) 18%,transparent)}
.subj b{display:block;font-size:20px;color:var(--m)}
.subj span{font-size:14px;color:var(--muted)}
.subj svg{width:72px;height:72px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.group-h{margin:22px 0 10px;font-size:15px;font-weight:700;color:var(--m)}
.topic{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--paper);text-decoration:none;color:var(--ink);min-height:96px}
a.topic:hover{border-color:var(--m)}
.topic.draft{background:transparent;border-style:dashed;color:var(--muted)}
.topic b{font-size:16px}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--m);border-radius:99px}
.note{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.banner{padding:14px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:15px}
/* lesson layout */
.lay{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto;padding:20px max(3vw,14px) 60px}
.lay.tut{grid-template-columns:250px minmax(0,1fr) 360px}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;padding:14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.side h3{font-size:14px;color:var(--muted);margin:14px 0 6px}
.side .gsel{display:flex;gap:4px}
.side .gsel button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700}
.side .gsel button[aria-pressed=true]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.side ul{list-style:none;margin:0;padding:0}
.side li a,.side li span{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:15px;min-height:40px}
.side li a[aria-current=true]{background:var(--ms);color:var(--m);font-weight:700}
.side li span{display:block;color:var(--muted);font-size:14px}
.side .x{display:none}
.pick{display:none}
.main{min-width:0}
.paper{background:var(--paper) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;background-blend-mode:normal;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,3vw,28px)}
.thead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.thead .ic{flex:none;width:64px;height:64px;border-radius:16px;background:var(--ms);display:grid;place-items:center}
.thead .ic svg{width:48px;height:48px}
.crumb{font-size:14px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 18px}
.tabs button{min-height:46px;padding:0 18px;border:0;background:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--m);border-color:var(--m)}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:12px 0}
.info>div{padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.info ul,.paper ul{margin:.3em 0;padding-left:1.2em}
.sec{margin:22px 0}
.sec h3{display:flex;align-items:center;gap:8px}
.kn li{margin:.35em 0}
.ex{border-left:5px solid var(--m);padding:12px 16px;background:var(--ms);border-radius:0 12px 12px 0}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper);margin:8px 0}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details>div{padding-bottom:12px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 2px;font-size:.92em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.ct{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;padding:4px 10px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;font-weight:600}
.arrow{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:20px}
.arrow small{font-size:11px;font-weight:500;color:var(--muted)}
/* practice */
.lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lv button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px}
.lv button[aria-pressed=true]{background:var(--m);border-color:var(--m);color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.dots button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:14px}
.dots button.cur{border-color:var(--m);color:var(--m)}
.dots button.d-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.d-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:clamp(16px,3vw,26px);border-top:6px solid var(--m)}
.q.tt{border-top-style:dashed}
.qh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qh .n{font-weight:800;font-size:18px;margin-right:4px}
.de{font-size:17px}
table.dt{border-collapse:collapse;margin:12px 0 4px;width:100%;font-size:15px}
table.dt th,table.dt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.dt th{background:var(--ms)}
.tnote{font-size:13px;color:var(--warn);font-style:italic}
.ans{margin:16px 0 8px}
.ans label.f{display:block;font-weight:600;margin-bottom:6px}
.ans .in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans input[type=text],.ans textarea,.step input,.tut-in textarea{width:100%;max-width:520px;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:17px}
.ans textarea{max-width:100%;min-height:120px;resize:vertical}
.ans input:focus,.ans textarea:focus{border-color:var(--blue);outline:none}
.ans .in input{flex:1 1 180px;width:auto}
.unit{font-weight:700;color:var(--muted);white-space:nowrap}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--blue)}
.opt .k{font-weight:800;color:var(--muted);min-width:1.4em}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt .why{display:block;font-size:14px;color:var(--bad);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.warn{border-color:var(--warn);background:var(--warn-soft)}
.fb .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;flex-wrap:wrap}
.fb .ico{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:15px;flex:none}
.fb.ok .ico{background:var(--ok)}.fb.bad .ico{background:var(--bad)}.fb.warn .ico{background:var(--warn)}
.work{margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:16px}
.work mark{background:light-dark(#ffe08a,#7a5b00);color:inherit;padding:0 3px;border-radius:4px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.step{margin-top:10px;padding:12px;border-radius:12px;background:var(--paper);border:1px dashed var(--warn)}
.step .in{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.step input{max-width:240px}
.box{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.box h4{margin:0 0 6px;font-size:15px}
.hints .box{border-left:5px solid var(--blue)}
.src{margin-top:12px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.src dl{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:6px 14px;margin:0}
.src dt{font-weight:700;color:var(--muted)}
.src dd{margin:0}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.rub{list-style:none;padding:0;margin:8px 0}
.rub li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.rub .st{flex:none;min-width:7.5em;font-size:13px;font-weight:700}
.rub label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rub input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.wc{font-size:13px;color:var(--muted)}
/* tutor */
.tutor{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);display:flex;flex-direction:column;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.tutor[hidden]{display:none}
.tut-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--blue-soft)}
.tut-h b{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.modes button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700}
.modes button[aria-pressed=true]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.ctx{font-size:13px;color:var(--muted);padding:0 14px 8px;border-bottom:1px solid var(--line)}
.log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.msg{padding:10px 12px;border-radius:14px;font-size:15px;max-width:94%}
.msg.me{align-self:flex-end;background:var(--blue);color:var(--on-blue);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:12px;font-weight:700;opacity:.75;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line)}
.chips button{min-height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.tut-in{display:flex;gap:6px;padding:8px 14px 14px}
.tut-in textarea{min-height:44px;height:44px;font-size:16px;resize:none;max-width:none}
/* review / teacher */
.rv{display:grid;gap:12px}
.rv .item{padding:14px 16px;border-left:6px solid var(--m)}
.rv .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0}
.rv .cols>div{padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.rv .cols b{display:block;font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
table.inv{border-collapse:collapse;width:100%;font-size:15px}
table.inv th,table.inv td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
table.inv th{font-size:13px;color:var(--muted);font-weight:700}
table.inv td.n,table.inv th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.inv tfoot td{font-weight:800;border-top:2px solid var(--ink)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font-size:13px;line-height:1.45}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;overflow-wrap:anywhere}
.guide h3{margin-top:22px}
.guide ol li,.guide ul li{margin:.3em 0}
.who{background:var(--blue-soft);color:var(--blue)!important;gap:6px}
.pick-hero{max-width:880px;margin:0 auto;text-align:center;padding-top:clamp(10px,4vw,40px)}
.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:28px 0 14px}
.member{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 18px;border-radius:22px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--sh);min-height:200px;justify-content:center}
.member:hover{border-color:var(--blue)}
.member b{font-size:24px}
.member .ava{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff}
.member.m0 .ava{background:linear-gradient(135deg,var(--blue),var(--toan))}
.member.m1 .ava{background:linear-gradient(135deg,var(--anh),var(--khtn))}

.kpi{padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.kpi b{display:block;font-size:clamp(22px,3vw,30px);line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.mtabs button{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.mtabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.recs{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.recs li{padding:10px 14px;border-radius:12px;background:var(--warn-soft);border-left:5px solid var(--warn)}
.recs li.good{background:var(--ok-soft);border-color:var(--ok)}
.bar{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 3em;gap:10px;align-items:center;margin:6px 0;font-size:15px}
.bar .tr{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--bad);border-radius:99px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
details.soan{margin-top:30px;padding:0 16px}details.soan>summary{font-size:18px}
@media(max-width:600px){.bar{grid-template-columns:minmax(0,1fr) 2.5em}.bar .tr{grid-column:1/-1;grid-row:2}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:15px;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1180px){.lay.tut{grid-template-columns:240px minmax(0,1fr)}.lay.tut .tutor{grid-column:2;position:static;max-height:none}.tutor .log{max-height:420px}}
@media(max-width:860px){
 .hero{grid-template-columns:minmax(0,1fr)}.hero .art{max-width:420px;aspect-ratio:16/10}

 .pick{display:inline-flex}

 .info{grid-template-columns:minmax(0,1fr)}
 .rv .cols{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
 body{font-size:16px}.de{font-size:16px}
 .grades{max-width:none}
 .thead .ic{width:48px;height:48px}.thead .ic svg{width:36px;height:36px}

    if (r.soTu) { const w = countWords(main); return { tuDong: true, ok: w >= r.soTu[0] && w <= r.soTu[1], note: w + ' từ' }; }
    if (r.soCau) { const k = countSent(main); return { tuDong: true, ok: k >= r.soCau[0] && k <= r.soCau[1], note: k + ' câu' }; }
    if (r.mau) { const k = (norm(main).match(new RegExp(r.mau, 'g')) || []).length; return { tuDong: true, ok: k >= (r.toiThieu || 1), note: 'tìm thấy ' + k }; }
    if (r.canhBao) { const h = norm(main).match(new RegExp(r.canhBao)); return { tuDong: true, ok: !h, note: h ? r.thongBao + ' (“' + h[0] + '”)' : 'không thấy lỗi thường gặp' }; }
    if (r.oPhuSoTu) { const w = countWords(phu); return { tuDong: true, ok: w >= r.oPhuSoTu, note: w + ' từ' }; }
    return { tuDong: false };
  });
}

function memberStats(att) {
  const st = { lam: 0, dungDau: 0, daSua: 0, conSai: [], goiY: 0, tt: 0, last: 0, loi: {}, recent: [], muc: {}, chuDe: {} };
  for (const [id, r] of Object.entries(att || {})) {

    c.lam++; if (x.tt) c.tt++;
    const m = (st.muc[x.q.muc] ??= { lam: 0, dungDau: 0 }); m.lam++;
    if (r.first && r.first.ok) { st.dungDau++; c.dungDau++; m.dungDau++; }
    else if (r.solved || r.done) { st.daSua++; c.daSua++; }
    else { st.conSai.push({ id, x, r }); c.conSai++; }
    st.goiY += r.goiY || 0;

  }
  st.recent.sort((a, b) => (b.tr.t || 0) - (a.tr.t || 0));

}

/* ---------- hiển thị một câu ---------- */
function curList(t) { const f = S.loc[t.id] || 'all'; return t.cauHoi.map((q, i) => ({ q, i })).filter(x => f === 'all' || x.q.muc === f); }
function renderQ(t, i, tt) {
  const goc = t.cauHoi[i] || t.cauHoi[0]; i = t.cauHoi.indexOf(goc);
  const q = tt && goc.tuongTu ? goc.tuongTu : goc; tt = q !== goc;
  V.q = q; V.goc = goc; V.i = i; V.tt = tt;
  setLast(t.id, i, tt);
  if ((S.loc[t.id] || 'all') !== 'all' && S.loc[t.id] !== goc.muc) S.loc[t.id] = 'all';
  const list = curList(t), f = S.loc[t.id] || 'all', posInList = list.findIndex(x => x.i === i);
  const r = S.att[q.id];
  const draft = S.draft[q.id] ?? (r?.tries?.length ? r.tries[r.tries.length - 1].a : (q.loai === 'chonNhieu' ? [] : q.loai === 'mo' ? {} : ''));
  $('#pane').innerHTML = `
  <div class="lv" role="group" aria-label="Chọn mức">${[['all', 'Học lần lượt'], ['co-ban', 'Cơ bản'], ['van-dung', 'Vận dụng'], ['nang-cao', 'Nâng cao']].map(([k, l]) => `<button data-lv="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
  <div class="dots" aria-label="Các câu">${t.cauHoi.map((x, k) => `<button data-go="${k}" class="${k === i && !tt ? 'cur ' : ''}${status(x.id) === 'ok' ? 'd-ok' : status(x.id) === 'bad' ? 'd-bad' : ''}" aria-label="Câu ${k + 1}, ${MUC[x.muc]}${status(x.id) === 'ok' ? ', đã đúng' : status(x.id) === 'bad' ? ', cần sửa' : ''}">${k + 1}</button>`).join('')}</div>
  <article class="q${tt ? ' tt' : ''}" id="qcard" aria-labelledby="qn">
    <div class="qh"><span class="n" id="qn">${tt ? 'Câu luyện lại' : `Câu ${f === 'all' ? i + 1 : posInList + 1}/${f === 'all' ? t.cauHoi.length : list.length}`}</span>
      <span class="badge" title="Mức độ">${MUC_ICON[q.muc]} ${MUC[q.muc]}</span>
      ${tt ? `<span class="badge plain">Tương tự câu ${i + 1}, dữ kiện mới</span>` : ''}
      ${q.nhieuCachDung ? '<span class="badge plain">Có nhiều cách viết đúng</span>' : ''}
      ${status(q.id) === 'ok' ? '<span class="badge ok">✓ Đã làm đúng</span>' : status(q.id) === 'bad' ? '<span class="badge bad">✗ Cần sửa</span>' : ''}</div>
    <div class="de">${q.de}</div>
    ${q.bang ? tableHTML(q.bang) : ''}
    <div class="ans">${inputHTML(q, draft)}</div>
    <div class="acts">
      <button class="btn pri" data-act="check" id="checkBtn">${q.loai === 'mo' ? 'Kiểm tra sơ bộ' : r?.tries?.some(x => !x.ok) ? 'Nộp lại' : 'Kiểm tra'}</button>
      <button class="btn soft" data-act="hint">💡 Xin gợi ý</button>
      <button class="btn ghost" data-act="src" aria-expanded="false">📖 Xem nguồn</button>
      <button class="btn ghost" data-act="tutor">🧑‍🏫 Hỏi gia sư</button>
    </div>
    <div class="hints" id="hints">${hintsHTML(q)}</div>
    <div id="fb" aria-live="polite"></div>
    <div id="src" hidden>${srcHTML(q)}</div>
  </article>
  <div class="qnav"><button class="btn" data-act="prev" ${posInList <= 0 && !tt ? 'disabled' : ''}>← Câu trước</button>${tt ? `<button class="btn" data-go="${i}">Về câu gốc ${i + 1}</button>` : ''}<button class="btn" data-act="next" ${posInList >= list.length - 1 ? 'disabled' : ''}>Câu tiếp →</button></div>`;
  // khôi phục phản hồi lần nộp gần nhất
  if (q.loai === 'mo') { if (r?.checked) showOpen(q, draft, true); }
  else if (r?.tries?.length) { const last = r.tries[r.tries.length - 1]; showFb(q, last.a, grade(q, last.a), true); }
  if (V.tutorOpen) renderTutor();
}
function tableHTML(b) { return `<div class="scroll"><table class="dt stack"><thead><tr>${b.tieuDe.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.dong.map(r => `<tr>${r.map((c, k) => `<td data-l="${esc(strip(b.tieuDe[k]))}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${b.ghiChu ? `<p class="tnote">⚑ ${esc(b.ghiChu)}</p>` : ''}`; }
function inputHTML(q, d) {
  if (q.loai === 'so') return `<label class="f" for="inp">Đáp án của em</label><div class="in"><input type="text" id="inp" inputmode="text" autocomplete="off" spellcheck="false" value="${esc(d)}" placeholder="${q.choPhanSo ? 'Ví dụ: -1/4 hoặc -0,25' : 'Ví dụ: 12 hoặc 10,8'}">${q.donVi ? `<span class="unit">${esc(q.donVi)}</span>` : ''}</div>${q.choPhanSo ? '<span class="note">Có thể gõ phân số dạng a/b; số thập phân dùng dấu phẩy hoặc dấu chấm.</span>' : ''}`;
  if (q.loai === 'chon1') return `<div class="opts" role="radiogroup">${q.phuongAn.map((o, k) => `<label class="opt" data-k="${k}"><input type="radio" name="opt" value="${k}" ${String(d) === String(k) ? 'checked' : ''}><span class="k">${'ABCDE'[k]}.</span><span>${o.t}<span class="why"></span></span></label>`).join('')}</div>`;
  if (q.loai === 'chonNhieu') return `<p class="note" style="margin-top:0">☑ Câu này có thể có <b>nhiều</b> đáp án đúng.</p><div class="opts">${q.phuongAn.map((o, k) => `<label class="opt" data-k="${k}"><input type="checkbox" name="opt" value="${k}" ${(d || []).map(String).includes(String(k)) ? 'checked' : ''}><span class="k">${'ABCDE'[k]}.</span><span>${o.t}<span class="why"></span></span></label>`).join('')}</div>`;
  if (q.loai === 'chu') return `<label class="f" for="inp">Câu trả lời của em</label><textarea id="inp" rows="2" spellcheck="false" style="min-height:56px">${esc(d)}</textarea>`;
  if (q.loai === 'mo') return `<label class="f" for="inp">Bài viết của em</label><textarea id="inp" rows="7">${esc(d.main || '')}</textarea><div class="wc" id="wc">${countWords(d.main || '')} từ</div>${q.oPhu ? `<label class="f" for="inp2" style="margin-top:10px">${esc(q.oPhu.nhan)}</label><textarea id="inp2" rows="2" style="min-height:64px" placeholder="${esc(q.oPhu.goiY || '')}">${esc(d.phu || '')}</textarea>` : ''}`;
  return '';
}
function readAns(q) {
  if (q.loai === 'chon1') return $('input[name=opt]:checked')?.value ?? '';
  if (q.loai === 'chonNhieu') return $$('input[name=opt]:checked').map(x => +x.value);
  if (q.loai === 'mo') return { main: $('#inp')?.value || '', phu: $('#inp2')?.value || '' };

}
function hintsHTML(q) { const n = S.att[q.id]?.goiY || 0; return (q.goiY || []).slice(0, n).map((h, k) => `<div class="box"><h4>💡 Gợi ý ${k + 1}/${q.goiY.length}</h4>${h}</div>`).join(''); }

function srcHTML(q, lesson) {
  const n = q.nguon || {}, k = q.kiemTra || {};
  const link = n.lienKet && /^https:\/\//.test(n.lienKet) ? `<a href="${esc(n.lienKet)}" target="_blank" rel="noopener">${esc(n.lienKet)}</a>` : '<span class="muted">Chưa có</span>';
  const none = '<span class="muted">Chưa ghi — chưa mở được tài liệu gốc, không tự đặt.</span>';
  return `<div class="src"><dl>
   <dt>Loại ${lesson ? 'nội dung' : 'bài'}</dt><dd><b>${esc(n.loai === 'C' ? n.loaiTen : LOAI_TEN[n.loai] || '—')}</b></dd>
   <dt>Nguồn ${lesson ? 'bài giảng' : 'bài tập'}</dt><dd>${esc(n.nguonBaiTap || '—')}</dd>
   ${n.thayDoi ? `<dt>Phần đã thay đổi</dt><dd>${esc(n.thayDoi)}</dd>` : ''}
   <dt>Căn cứ kiến thức</dt><dd>${n.canCu === 'Chờ đối chiếu tài liệu' ? '<span class="badge wait">⏳ Chờ đối chiếu tài liệu</span>' : /^Đã đối chiếu/.test(n.canCu || '') ? '<span class="badge ok">✓ Đã đối chiếu</span> ' + esc(n.canCu.replace(/^Đã đối chiếu:\s*/, '')) : esc(n.canCu || '—')}</dd>
   ${n.tenTaiLieu ? `<dt>Tên tài liệu</dt><dd>${esc(n.tenTaiLieu)}</dd>` : ''}${n.tacGia ? `<dt>Tác giả</dt><dd>${esc(n.tacGia)}</dd>` : ''}${n.donViPhatHanh ? `<dt>Đơn vị phát hành</dt><dd>${esc(n.donViPhatHanh)}</dd>` : ''}${n.anBan ? `<dt>Ấn bản</dt><dd>${esc(n.anBan)}</dd>` : ''}${n.banDoc ? `<dt>Bản đã đọc</dt><dd class="small">${esc(n.banDoc)}</dd>` : ''}${n.ghiChu ? `<dt>Ghi chú</dt><dd class="small">${esc(n.ghiChu)}</dd>` : ''}
   ${n.canDoiChieu ? `<dt>Tài liệu cần đối chiếu</dt><dd>${esc(n.canDoiChieu)}</dd>` : ''}

   ${k.cachKiemTra ? `<dt>Cách kiểm tra đáp án</dt><dd class="small">${esc(k.cachKiemTra)}</dd>` : ''}
   ${q.muc ? `<dt>Ghi chú cho giáo viên</dt><dd class="small">Mã ${esc(q.id)} · Mức <b>${MUC[q.muc]}</b>: ${esc(q.liDoMuc || '')}</dd>` : ''}
  </dl></div>`;
}

/* ---------- phản hồi ---------- */
function showFb(q, a, g, restoring) {
  const fb = $('#fb'); if (!fb) return;
  $$('.opt').forEach(o => { o.classList.remove('sel-bad', 'sel-ok'); $('.why', o).textContent = ''; });
  if (g.hopLe === false) { fb.innerHTML = `<div class="fb warn"><div class="h"><span class="ico">!</span>Chưa có câu trả lời</div><p>${esc(g.msg || '')}</p></div>`; return; }
  const r = S.att[q.id] || { tries: [] };
  if (g.dung) {
    const hadWrong = r.tries.some(x => !x.ok);
    if (q.loai === 'chon1' || q.loai === 'chonNhieu') $$('input[name=opt]:checked').forEach(x => x.closest('.opt').classList.add('sel-ok'));
    const firstWrong = r.tries.find(x => !x.ok);
    fb.innerHTML = `<div class="fb ok"><div class="h"><span class="ico">✓</span>Đúng rồi!</div>
      <p>${q.viSaoDung || ''}</p>
      ${hadWrong ? `<div class="box"><h4>🌱 Em đã tiến bộ</h4><p>${q.tienBo || 'Em đã tự sửa được lỗi.'}</p><p class="small muted">Lần đầu: “${esc(ansText(q, firstWrong.a))}” → Bản sửa: “${esc(ansText(q, a))}” (sau ${r.tries.filter(x => !x.ok).length} lần chưa đúng${r.goiY ? ', dùng ' + r.goiY + ' gợi ý' : ''}).</p></div>` : ''}
      <div class="acts">${!V.tt && V.goc.tuongTu ? `<button class="btn pri" data-act="similar">${hadWrong ? 'Làm câu tương tự với dữ kiện mới →' : 'Luyện thêm câu tương tự'}</button>` : ''}<button class="btn" data-act="next">Câu tiếp →</button><button class="btn ghost" data-act="sol">Xem lời giải đầy đủ</button></div>
      <div id="solBox"></div></div>`;
    return;
  }
  // sai
  let work = '';
  if (q.loai === 'chon1' || q.loai === 'chonNhieu') {
    (g.chonSai || []).forEach(k => { const o = $(`.opt[data-k="${k}"]`); if (o) { o.classList.add('sel-bad'); $('.why', o).innerHTML = '✗ ' + (q.phuongAn[k].phanHoi || ''); } });
  } else if (q.loai === 'chu') work = `<div class="work"><span class="small muted">Bài làm của em:</span><br>${showWork(a, g.danh)}</div>`;
  else if (q.loai === 'so') work = `<div class="work"><span class="small muted">Em trả lời:</span> <mark>${esc(String(a).trim())}</mark> ${esc(q.donVi || '')}</div>`;
  const known = !!g.loi;
  fb.innerHTML = `<div class="fb ${known ? 'bad' : 'warn'}"><div class="h"><span class="ico">${known ? '✗' : '?'}</span>${known ? 'Chưa đúng' : 'Chưa đúng — cô cần xem em làm thế nào'}${g.loi?.nhan ? `<span class="badge bad">${esc(g.loi.nhan)}</span>` : ''}</div>
    ${work}
    ${g.loi ? `<p>${g.loi.phanHoi}</p>` : '<p>Cô chưa đoán được em sai ở bước nào. Trước khi kết luận, em trả lời giúp cô một bước làm nhé.</p>'}
    ${g.hoiBuoc ? stepHTML(q) : ''}
    <p class="small muted">Bài làm của em vẫn được giữ nguyên bên trên.</p>
    <div class="acts"><button class="btn pri" data-act="fix">✎ Sửa và nộp lại</button><button class="btn soft" data-act="reteach">Giảng lại cho em</button><button class="btn ghost" data-act="sol">Xem lời giải đầy đủ</button></div>
    <div id="reBox"></div><div id="solBox"></div></div>`;
}
function stepHTML(q) { return `<div class="step"><b>Cô hỏi thêm một bước:</b> ${q.buoc.hoi}<div class="in"><input type="text" id="stepIn" autocomplete="off" aria-label="Trả lời bước làm"><button class="btn sm" data-act="step">Trả lời</button></div><div id="stepFb" aria-live="polite"></div></div>`; }
function showOpen(q, a, restoring) {
  const res = checkOpen(q, a), r = att(q.id);
  r.tuCham ??= [];
  $('#fb').innerHTML = `<div class="fb warn"><div class="h"><span class="ico">✎</span>Kiểm tra sơ bộ và tự đối chiếu</div>
   <p class="small">Máy chỉ kiểm tra được vài dấu hiệu (độ dài, từ khóa, cấu trúc). Em hãy đọc lại bài và tự đánh dấu từng tiêu chí, rồi so với bài tham khảo.</p>
   <ul class="rub">${q.tieuChi.map((c, k) => `<li><span class="st">${res[k].tuDong ? (res[k].ok ? '<span class="badge ok">✓ Máy thấy</span>' : '<span class="badge bad">⚠ Cần xem lại</span>') : '<span class="badge plain">Em tự xét</span>'}</span><label><input type="checkbox" data-rub="${k}" ${r.tuCham[k] ? 'checked' : ''}><span>${esc(c.t)}${res[k].note ? ` <span class="small muted">(${esc(res[k].note)})</span>` : ''}</span></label></li>`).join('')}</ul>
   <div class="acts"><button class="btn soft" data-act="model">Xem bài tham khảo</button>${q.giupViet ? '<button class="btn ghost" data-act="helpw">Giúp em viết</button>' : ''}<button class="btn pri" data-act="selfdone">Em đã tự đối chiếu xong</button>${!V.tt && V.goc.tuongTu ? '<button class="btn" data-act="similar">Làm câu tương tự →</button>' : ''}</div>
   <div id="solBox"></div></div>`;
}

/* ---------- xử lý sự kiện ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('button,[data-resume]'); if (!b) return;
  const t = T[V.tid];
  if (b.dataset.lop) { S.lop = +b.dataset.lop; save(); return viewHome(); }
  if (b.dataset.mon) { S.mon = b.dataset.mon; save(); return viewHome(); }
  if (b.dataset.sidelop) { V.sideLop = +b.dataset.sidelop; $('#side').innerHTML = sideHTML(t); return; }
  if (b.dataset.tab) { S.tab[t.id] = b.dataset.tab; save(); return viewTopic(t); }
  if (b.dataset.lv) { S.loc[t.id] = b.dataset.lv; save(); const l = curList(t); return renderQ(t, l[0]?.i ?? 0, false); }
  if (b.dataset.go !== undefined) return renderQ(t, +b.dataset.go, false);
  const act = b.dataset.act; if (!act) return;
  const q = V.q;
  switch (act) {
    case 'pick': $('#side').classList.toggle('open'); break;
    case 'srcLesson': { const s = $('#srcLesson'); s.hidden = !s.hidden; break; }
    case 'check': {
      const a = readAns(q);
      if (q.loai === 'mo') { if (countWords(a.main) < 3) { $('#fb').innerHTML = '<div class="fb warn"><div class="h"><span class="ico">!</span>Em chưa viết bài</div><p>Em hãy viết bài vào ô rồi bấm lại.</p></div>'; return; }
        const r = att(q.id); r.checked = true; if (!r.first) r.first = { a, ok: true, nhan: null, t: Date.now() }; r.tries.push({ a, ok: true, t: Date.now() }); save(); showOpen(q, a); return; }
      const g = grade(q, a);
      if (g.hopLe === false) return showFb(q, a, g);
      record(q, a, g); delete S.draft[q.id]; save();
      showFb(q, a, g);
      refreshDots(t);
      if (!g.dung) $('#checkBtn').textContent = 'Nộp lại';
      if (V.tutorOpen) renderTutor();
      break;
    }
    case 'fix': { const inp = $('#inp') || $('input[name=opt]'); inp?.focus(); $('#qcard').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('#checkBtn').textContent = 'Nộp lại'; toast('Em sửa ngay trong ô trả lời rồi bấm “Nộp lại”.'); break; }

    if (!d.att || typeof d.att !== 'object') throw new Error('Mã không có dữ liệu bài làm.');
    const cu = ROOT.nhap[d.ten]; if (cu && cu.xuat > d.xuat) throw new Error('Mã này cũ hơn kết quả đã nhận trước đó.');
    ROOT.nhap[d.ten] = { att: d.att, xuat: d.xuat || Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(ROOT)); } catch (x) {}
    maXem = d.ten; viewTeacher(); toast('Đã nhận kết quả của ' + d.ten + '.');
  } catch (err) { if (fb) fb.textContent = '✗ ' + err.message; }
}

window.__lophoc = { grade, parseNum, checkOpen, validate, inventory, ALLQ, state: () => S, root: () => ROOT, memberStats, memberAtt };
route();
}
}
</script>

/* Cho phép dùng ngoại tuyến khi trang được đưa lên web (https). Mở bằng file:// thì bỏ qua. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
